<!DOCTYPE html>
<html>
<head>
  <title>KIIT Admission Form</title>
  <style>
    body{
      margin:0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:#f3fff7;
      padding:30px;
    }

    .container{
      width: 60%;
      margin:auto;
      background: white;
      padding: 25px 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
      border: 1px solid rgba(0,0,0,0.10);
    }

    h2{
      text-align:center;
      color:#0b7a36;
      margin-bottom: 20px;
      font-size:28px;
    }

    label{
      font-weight:700;
      color:#14532d;
      display:block;
      margin-top:10px;
      margin-bottom:6px;
    }

    input, select, textarea{
      width:100%;
      padding:10px;
      border:1px solid #aaa;
      border-radius:8px;
      outline:none;
      font-size:14px;
      background:#f9fffb;
    }

    textarea{
      resize:none;
      height:70px;
    }

    .row{
      display:flex;
      gap:12px;
    }
    .row .col{
      flex:1;
    }

    .radio-group{
      display:flex;
      gap:15px;
      margin-top:5px;
    }

    .btn-group{
      text-align:center;
      margin-top:20px;
    }

    button{
      padding:12px 22px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
      font-size:15px;
      color:white;
      margin:0 8px;
    }

    .submit-btn{
      background: linear-gradient(135deg, #0b7a36, #16c35a);
    }

    .reset-btn{
      background: #c62828;
    }

    button:hover{
      opacity:0.9;
    }

    @media(max-width:900px){
      .container{ width:95%; }
      .row{ flex-direction:column; }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>KIIT Student Admission Form</h2>

  <form action="admission_save.php" method="POST">

    <label>Full Name</label>
    <input type="text" name="fullname" required>

    <div class="row">
      <div class="col">
        <label>Father Name</label>
        <input type="text" name="fathername" required>
      </div>

      <div class="col">
        <label>Mother Name</label>
        <input type="text" name="mothername" required>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Date of Birth</label>
        <input type="date" name="dob" required>
      </div>

      <div class="col">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Phone</label>
        <input type="text" name="phone" maxlength="10" required>
      </div>

      <div class="col">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
    </div>

    <label>Address</label>
    <textarea name="address" required></textarea>

    <div class="row">
      <div class="col">
        <label>Program</label>
        <select name="program" required>
          <option value="">Select Program</option>
          <option value="B.Tech">B.Tech</option>
          <option value="M.Tech">M.Tech</option>
          <option value="BCA">BCA</option>
          <option value="MCA">MCA</option>
          <option value="MBA">MBA</option>
        </select>
      </div>

      <div class="col">
        <label>Branch</label>
        <select name="branch" required>
          <option value="">Select Branch</option>
          <option value="CSE">CSE</option>
          <option value="IT">IT</option>
          <option value="CSCE">CSCE</option>
          <option value="CSSE">CSSE</option>
          <option value="ECE">ECE</option>
          <option value="EEE">EEE</option>
          <option value="ME">ME</option>
          <option value="CE">CE</option>
        </select>
      </div>
    </div>

    <div class="btn-group">
      <button type="submit" class="submit-btn">SUBMIT</button>
      <button type="reset" class="reset-btn">RESET</button>
    </div>

  </form>
</div>

</body>
</html>
