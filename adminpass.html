<html>
<head>
    <title>Admin Login - KIIT University</title>
    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background:#f6fbf8;
        }
        .container{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .login-box{
            background:#ffffff;
            width:360px;
            padding:20px;
            border-radius:10px;
            border:1px solid #e0efe0;
        }
        h2{
            text-align:center;
            color:#006400;
            margin-bottom:20px;
        }
        label{
            font-weight:bold;
            color:#333333;
        }
        input[type="text"],
        input[type="password"]{
            width:100%;
            padding:10px;
            margin-top:6px;
            margin-bottom:14px;
            border:1px solid #cccccc;
            border-radius:6px;
            font-size:14px;
        }
        .btn-row{
            text-align:center;
            margin-top:10px;
        }
        input[type="submit"],
        input[type="reset"]{
            padding:8px 16px;
            font-size:14px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
        }
        input[type="submit"]{
            background:#006400;
            color:white;
        }
        input[type="reset"]{
            background:#888888;
            color:white;
            margin-left:10px;
        }
        .note{
            margin-top:14px;
            font-size:12px;
            color:#666666;
            text-align:center;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="login-box">
        <h2>Admin Login</h2>

        <!-- FORM ONLY (No Script) -->
        <form action="verification.php" method="POST">
            <label>Username</label><br>
            <input type="text" name="username" placeholder="Enter admin username" required><br>

            <label>Password</label><br>
            <input type="password" name="password" placeholder="Enter password" required><br>

            <div class="btn-row">
                <input type="submit" value="OK" name="submit">
                <input type="reset" value="Cancel">
            </div>
        </form>

        <div class="note">
            Authorized personnel only
        </div>
    </div>
</div>
</body>
</html>
